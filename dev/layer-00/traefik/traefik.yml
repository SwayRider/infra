entryPoints:
  web:
    address: ":80"
  traefik:
    address: ":8080"

providers:
  docker:
    exposedByDefault: false
    network: net-sw-dev-proxy

api:
  dashboard: true
  insecure: true

log:
  level: DEBUG

accessLog: {}

serversTransport:
  respondingTimeouts:
    readTimeout: 0     # disabled — SSE keeps the connection open indefinitely
    writeTimeout: 0
    idleTimeout: 600s
