entryPoints:
  web:
    address: ":80"
    # HAProxy sends PROXY protocol v2 (send-proxy-v2) for the real client
    # IP — https_in is mode tcp/SNI passthrough so it can't set
    # X-Forwarded-For, hence PROXY protocol for both entrypoints.
    # trustedIPs is net-sw-dev-proxy's gateway (confirmed via
    # `docker network inspect net-sw-dev-proxy`), not HAProxy's real IP —
    # that's the address Traefik sees as its TCP peer for host-mapped ports.
    proxyProtocol:
      trustedIPs:
        - "10.10.0.16/32"
    transport:
      respondingTimeouts:
        readTimeout: 0
        writeTimeout: 0
        idleTimeout: 600s
  websecure:
    address: ":443"
    proxyProtocol:
      trustedIPs:
        - "10.10.0.16/32"
    transport:
      respondingTimeouts:
        readTimeout: 0
        writeTimeout: 0
        idleTimeout: 600s
  traefik:
    address: ":8080"

providers:
  docker:
    exposedByDefault: false
    network: net-sw-dev-proxy

api:
  dashboard: true
  insecure: true

log:
  level: DEBUG

accessLog: {}

serversTransport:
  forwardingTimeouts:
    responseHeaderTimeout: 0    # disabled — SSE keeps the connection open indefinitely

certificatesResolvers:
  letsencrypt:
    acme:
      email: ""  # set via --certificatesresolvers.letsencrypt.acme.email CLI arg in compose.yaml
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
