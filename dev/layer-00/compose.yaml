networks:
  net-sw-dev-proxy:
    name: net-sw-dev-proxy
    driver: bridge
    attachable: true
    ipam:
      driver: default
      config:
        - subnet: 10.10.0.0/24
          # Dynamic (unpinned) containers only get addresses from this
          # sub-range, keeping 10.10.0.2-15 free for static pins like
          # traefik's 10.10.0.2 without racing another container for it.
          ip_range: 10.10.0.16/28

  net-sw-dev-data:
    name: net-sw-dev-data
    driver: bridge
    attachable: true
    ipam:
      driver: default
      config:
        - subnet: 10.10.1.0/24

services:
  traefik-init:
    image: alpine
    container_name: sw-dev-traefik-init
    restart: no
    volumes:
      - "./traefik/letsencrypt:/letsencrypt"
    command: 'sh -c "touch /letsencrypt/acme.json && chmod 600 /letsencrypt/acme.json"'

  traefik:
    image: traefik:latest
    container_name: sw-dev-traefik
    restart: unless-stopped
    depends_on:
      - traefik-init
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=net-sw-dev-proxy"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    ports:
      - "30080:80"
      - "30443:443"
      - "38080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/traefik${SSL_ENABLED:+-ssl}.yml:/etc/traefik/traefik.yml:ro"
      - "./traefik/traefik_dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro"
      - "./traefik/letsencrypt:/letsencrypt"
    networks:
      net-sw-dev-proxy:
        # Pinned so swayrider-api can whitelist exactly this IP in TRUSTED_PROXIES
        # (the wireguard container shares this subnet, so the subnet itself is
        # not trustworthy). Keep in sync with layer-30's TRUSTED_PROXIES.
        ipv4_address: 10.10.0.2
    deploy:
      resources:
        limits:
          cpus: '${TRAEFIK_CPU_LIMIT:-0.5}'
          memory: ${TRAEFIK_MEM_LIMIT:-256m}

  # Elastic search
  prepare-elasticsearch:
    image: alpine
    container_name: sw-dev-prepare-elasticsearch
    restart: no
    volumes:
      - "${ES_DATA_PATH}:/usr/share/elasticsearch/data"
      - "${ES_SNAPSHOTS_PATH}:/usr/share/elasticsearch/snapshots"
    command: [ "/bin/sh", "-c", "chown -R 1000 /usr/share/elasticsearch/data && chown -R 1000 /usr/share/elasticsearch/snapshots" ]

  elasticsearch:
    image: elasticsearch:7.17.28
    container_name: sw-dev-elasticsearch
    restart: unless-stopped
    depends_on:
      - prepare-elasticsearch
    environment:
      - "discovery.type=single-node"
      - "ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms4g -Xmx4g}"
      - "xpack.security.enabled=false"
      - "xpack.license.self_generated.type=basic"
      - "path.repo=/usr/share/elasticsearch/snapshots"
    entrypoint: ["sh", "-c", "/usr/local/bin/es-init.sh"]
    ports:
      - "39200:9200"
      - "39300:9300"
    volumes:
      - "./elastic-init/es-init.sh:/usr/local/bin/es-init.sh"
      - "${ES_DATA_PATH}:/usr/share/elasticsearch/data"
      - "${ES_SNAPSHOTS_PATH}:/usr/share/elasticsearch/snapshots"
    networks:
      - net-sw-dev-data
    deploy:
      resources:
        limits:
          cpus: '${ES_CPU_LIMIT:-2}'
          memory: ${ES_MEM_LIMIT:-5g}

  # WireGuard VPN
  wireguard:
    image: ghcr.io/wg-easy/wg-easy
    container_name: sw-dev-wireguard
    restart: unless-stopped
    environment:
      - WG_HOST=${WG_HOST}
      - WG_PASSWORD=${WG_PASSWORD}
      - WG_DEFAULT_DNS=1.1.1.1
      - WG_ALLOWED_IPS=10.8.0.0/24
    entrypoint: ["/bin/sh", "/etc/wireguard/entrypoint.sh"]
    volumes:
      - "./wireguard:/etc/wireguard"
    ports:
      - "${WG_UDP_PORT:-51820}:51820/udp"
      - "${WG_TCP_PORT:-51821}:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      - net-sw-dev-proxy
    deploy:
      resources:
        limits:
          cpus: '${WG_CPU_LIMIT:-0.25}'
          memory: ${WG_MEM_LIMIT:-128m}

  # Redis
  redis:
    image: redis:7-alpine
    container_name: sw-dev-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "36379:6379"
    networks:
      - net-sw-dev-data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '${REDIS_CPU_LIMIT:-0.5}'
          memory: ${REDIS_MEM_LIMIT:-384m}

  # Postgres
  postgres:
    image: postgres:18
    container_name: sw-dev-postgres
    restart: unless-stopped
    environment:
      - "POSTGRES_USER=${POSTGRES_USER}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
      - "POSTGRES_DB=${POSTGRES_DB}"
    ports:
      - "35432:5432"
    volumes:
      - "${POSTGRES_DATA_PATH}:/var/lib/postgresql"
    networks:
      - net-sw-dev-data
    deploy:
      resources:
        limits:
          cpus: '${POSTGRES_CPU_LIMIT:-1}'
          memory: ${POSTGRES_MEM_LIMIT:-1g}
