entryPoints:
  web:
    address: ":80"
    transport:
      respondingTimeouts:
        readTimeout: 0
        writeTimeout: 0
        idleTimeout: 600s
  websecure:
    address: ":443"
    transport:
      respondingTimeouts:
        readTimeout: 0
        writeTimeout: 0
        idleTimeout: 600s
  traefik:
    address: ":8080"

providers:
  docker:
    exposedByDefault: false
    network: net-sw-dev-proxy

api:
  dashboard: true
  insecure: true

log:
  level: DEBUG

accessLog: {}

serversTransport:
  forwardingTimeouts:
    responseHeaderTimeout: 0    # disabled — SSE keeps the connection open indefinitely

certificatesResolvers:
  letsencrypt:
    acme:
      email: ""  # set via --certificatesresolvers.letsencrypt.acme.email CLI arg in compose.yaml
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
