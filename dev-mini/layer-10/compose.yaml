  pelias-germany-interpolation:
    image: pelias/interpolation:latest
    container_name: sw-dev-pelias-germany-interpolation
    restart: unless-stopped
    # image CMD: ./interpolate server /data/interpolation/address.db /data/interpolation/street.db
    environment:
      - "PORT=4300"   # the server listens on $PORT (default 3000); pelias.json points the api at :4300
    ports:
