    container_name: sw-dev-pelias-benelux-api
    restart: unless-stopped
    depends_on:
      - pelias-benelux-pip
      - pelias-benelux-interpolation
      - pelias-libpostal
      - pelias-placeholder
    environment:
      - "PELIAS_CONFIG=/etc/config/pelias.json"
    ports:
      - "33111:3100"
    volumes:
      - type: bind
        source: ${PELIAS_ROOT}/current/benelux/pelias.json
        target: /etc/config/pelias.json
        read_only: true
        bind:
          create_host_path: false
    networks:
      - net-sw-dev-pelias
      - net-sw-dev-data

  pelias-france-pip:
