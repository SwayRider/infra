networks:
  net-sw-dev-data:
    external: true

  net-sw-dev-valhalla:
    name: net-sw-dev-valhalla
    driver: bridge
    attachable: true
    ipam:
      driver: default
      config:
        - subnet: 10.10.10.0/24

  net-sw-dev-pelias:
    name: net-sw-dev-pelias
    driver: bridge
    attachable: true
    ipam:
      driver: default
      config:
        - subnet: 10.10.11.0/24

services:
  valhalla-benelux:
    image: ghcr.io/nilsnolde/docker-valhalla/valhalla:latest
    container_name: sw-dev-valhalla-benelux
    restart: unless-stopped
    environment:
      - "use_tiles_ignore_pbf=True"
      - "force_rebuild=False"
      - "server_threads=${VALHALLA_SERVER_THREADS}"
    ports:
      - "33001:8002"
    # /custom_files is a scratch directory on the same disk as the releases (${VALHALLA_ROOT}/work/<region>; the image
    # writes file_hashes.txt etc. there, uid 59999); the release files are mounted into it read-only. `current` is resolved when the container starts, so a restart picks up a new release.
    volumes:
      - '${VALHALLA_ROOT}/work/benelux:/custom_files'
      - type: bind
        source: ${VALHALLA_ROOT}/current/benelux/valhalla_tiles.tar
        target: /custom_files/valhalla_tiles.tar
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VALHALLA_ROOT}/current/benelux/admin.sqlite
        target: /custom_files/admin.sqlite
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VALHALLA_ROOT}/current/benelux/tz_world.sqlite
        target: /custom_files/tz_world.sqlite
        read_only: true
        bind:
          create_host_path: false
      - './valhalla/benelux/valhalla.json:/custom_files/valhalla.json:ro'
    networks:
      - net-sw-dev-valhalla
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  valhalla-france:
    image: ghcr.io/nilsnolde/docker-valhalla/valhalla:latest
    container_name: sw-dev-valhalla-france
    restart: unless-stopped
    environment:
      - "use_tiles_ignore_pbf=True"
      - "force_rebuild=False"
      - "server_threads=${VALHALLA_SERVER_THREADS}"
    ports:
      - "33002:8002"
    # /custom_files is a scratch directory on the same disk as the releases (${VALHALLA_ROOT}/work/<region>; the image
    # writes file_hashes.txt etc. there, uid 59999); the release files are mounted into it read-only. `current` is resolved when the container starts, so a restart picks up a new release.
    volumes:
      - '${VALHALLA_ROOT}/work/france:/custom_files'
      - type: bind
        source: ${VALHALLA_ROOT}/current/france/valhalla_tiles.tar
        target: /custom_files/valhalla_tiles.tar
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VALHALLA_ROOT}/current/france/admin.sqlite
        target: /custom_files/admin.sqlite
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VALHALLA_ROOT}/current/france/tz_world.sqlite
        target: /custom_files/tz_world.sqlite
        read_only: true
        bind:
          create_host_path: false
      - './valhalla/france/valhalla.json:/custom_files/valhalla.json:ro'
    networks:
      - net-sw-dev-valhalla
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  valhalla-germany:
    image: ghcr.io/nilsnolde/docker-valhalla/valhalla:latest
    container_name: sw-dev-valhalla-germany
    restart: unless-stopped
    environment:
      - "use_tiles_ignore_pbf=True"
      - "force_rebuild=False"
      - "server_threads=${VALHALLA_SERVER_THREADS}"
    ports:
      - "33003:8002"
    # /custom_files is a scratch directory on the same disk as the releases (${VALHALLA_ROOT}/work/<region>; the image
    # writes file_hashes.txt etc. there, uid 59999); the release files are mounted into it read-only. `current` is resolved when the container starts, so a restart picks up a new release.
    volumes:
      - '${VALHALLA_ROOT}/work/germany:/custom_files'
      - type: bind
        source: ${VALHALLA_ROOT}/current/germany/valhalla_tiles.tar
        target: /custom_files/valhalla_tiles.tar
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VALHALLA_ROOT}/current/germany/admin.sqlite
        target: /custom_files/admin.sqlite
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VALHALLA_ROOT}/current/germany/tz_world.sqlite
        target: /custom_files/tz_world.sqlite
        read_only: true
        bind:
          create_host_path: false
      - './valhalla/germany/valhalla.json:/custom_files/valhalla.json:ro'
    networks:
      - net-sw-dev-valhalla
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  pelias-placeholder:
    image: pelias/placeholder:latest
    container_name: sw-dev-pelias-placeholder
    restart: unless-stopped
    environment:
      - "PLACEHOLDER_DATA=/data"
    ports:
      - "33100:3000"
    volumes:
      - type: bind
        source: ${PELIAS_ROOT}/current/placeholder/data
        target: /data
        read_only: true
        bind:
          create_host_path: false
    networks:
      - net-sw-dev-pelias

  pelias-libpostal:
    image: pelias/libpostal-service:latest
    container_name: sw-dev-pelias-libpostal
    restart: unless-stopped
    ports:
      - "33101:4400"
    networks:
      - net-sw-dev-pelias

  pelias-benelux-pip:
    image: pelias/pip-service:latest
    container_name: sw-dev-pelias-benelux-pip
    restart: unless-stopped
    environment:
      - "PELIAS_CONFIG=/etc/config/pelias.json"
    ports:
      - "33110:3102"
    volumes:
      - type: bind
        source: ${PELIAS_ROOT}/current/benelux/wof
        target: /data/whosonfirst
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PELIAS_ROOT}/current/benelux/pelias.json
        target: /etc/config/pelias.json
        read_only: true
        bind:
          create_host_path: false
    networks:
      - net-sw-dev-pelias

  pelias-benelux-interpolation:
    image: pelias/interpolation:latest
    container_name: sw-dev-pelias-benelux-interpolation
    restart: unless-stopped
    # image CMD: ./interpolate server /data/interpolation/address.db /data/interpolation/street.db
    environment:
      - "PORT=4300"   # the server listens on $PORT (default 3000); pelias.json points the api at :4300
    ports:
      - "33112:4300"
    volumes:
      - type: bind
        source: ${PELIAS_ROOT}/current/benelux/interpolation
        target: /data/interpolation
        read_only: true
        bind:
          create_host_path: false
    networks:
      - net-sw-dev-pelias

  pelias-benelux-api:
